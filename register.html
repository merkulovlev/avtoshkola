<body>
  <header>
    <a href="index.html"><strong>Автошкола</strong></a>

        <ul>
          <li><a href="index.html">Главная</a></li>

          <li><a href="register.html">Регистрация</a></li>
          <li><a href="profile.html">Личный кабинет</a></li>
  </header>
  <main>
    <h1>Регистрация</h1>
    <form action="register.php" method="post">
      <fieldset>
        <legend>Данные аккаунта</legend>
        <p>
          <label for="name">Имя</label><br>
          <input type="text" id="name" name="name" required minlength="2"
          autocomplete="name">
        </p>
        <p>
          <label for="email">E-mail</label><br>
          <input type="email" id="email" name="email" required autocomplete="email">
        </p>
        <p>
          <label for="password">Пароль (не менее 8 символов)</label><br>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </p>
        <p>
          <label for="password2">Повторите пароль</label><br>
          <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password">
        </p>
        <p>
          <label for="birth">Дата рождения</label><br>
          <input type="date" id="birth" name="birth" max="2010-12-31">
        </p>
      </fieldset>
      <p>
        <label><input type="checkbox" name="agree" value="1" required>
          Принимаю условия обработки персональных данных</label>
      </p>
      <button type="submit">Создать аккаунт</button>
      <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </form>
  </main>

  <footer><p>&copy; 2026 Автошкола. Учебный проект. </p></footer>
</body>
